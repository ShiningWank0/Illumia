[package]
name = "illumia-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5.3"
blake3 = "1.8.5"
chrono = { version = "0.4.45", features = ["serde"] }
fast_image_resize = "6.1.0"
hex = "0.4.3"
image = "0.25.10"
rand = "0.10.2"
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
thumbhash = "0.1.0"
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
webp = "0.3.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
