# 本番ビルド (配布物はここでのみ作る → docs/09)。
# タグ `v*` の push または手動実行 (workflow_dispatch) で起動する。
# コンポーネントが未実装の間は preflight の存在チェックで該当ジョブを自動スキップし、
# リポジトリがどの段階でも green を保つ。各ジョブの詳細は該当コンポーネント実装時
# (M0/M1/M5/M6) に仕上げる。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      docker_server: ${{ steps.check.outputs.docker_server }}
      docker_ml: ${{ steps.check.outputs.docker_ml }}
      desktop: ${{ steps.check.outputs.desktop }}
      android: ${{ steps.check.outputs.android }}
      version: ${{ steps.check.outputs.version }}
      owner_lc: ${{ steps.check.outputs.owner_lc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: check
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          [ -f docker/Dockerfile.server ] && out docker_server true || out docker_server false
          [ -f docker/Dockerfile.ml ] && out docker_ml true || out docker_ml false
          [ -f crates/illumia-desktop/Cargo.toml ] && out desktop true || out desktop false
          [ -f apps/android/src-tauri/tauri.conf.json ] && out android true || out android false
          # Docker のリポジトリ名は小文字必須 (owner に大文字が含まれるため変換)
          out owner_lc "${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            out version "${GITHUB_REF#refs/tags/}"
          else
            out version "dev-$(git rev-parse --short HEAD)"
          fi

  docker:
    needs: preflight
    if: needs.preflight.outputs.docker_server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: illumia-server
            dockerfile: docker/Dockerfile.server
          - image: illumia-ml
            dockerfile: docker/Dockerfile.ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.image == 'illumia-ml' && needs.preflight.outputs.docker_ml != 'true'
        run: echo "skip=1" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: env.skip != '1'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.skip != '1'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: calculate immutable and stable tags
        id: image
        if: env.skip != '1'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.preflight.outputs.owner_lc }}/${{ matrix.image }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$VERSION"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "$IMAGE:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        if: env.skip != '1'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    needs: preflight
    if: needs.preflight.outputs.desktop == 'true'
    strategy:
      matrix:
        include:
          - os: macos-14        # Apple Silicon ランナー。x86_64 も cross ビルドし universal 化
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: build (macOS universal)
        if: matrix.name == 'macos'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release -p illumia-desktop --target aarch64-apple-darwin
          cargo build --release -p illumia-desktop --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/illumia-desktop \
            target/x86_64-apple-darwin/release/illumia-desktop \
            -output dist/illumia-desktop-macos-universal
          # TODO(M6): .app バンドル化・PyInstaller 製 ml サイドカー同梱・署名/公証
      - name: build (Windows)
        if: matrix.name == 'windows'
        run: |
          cargo build --release -p illumia-desktop
          mkdir dist
          copy target\release\illumia-desktop.exe dist\illumia-desktop-windows-x64.exe
        shell: cmd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*

  android:
    needs: preflight
    if: needs.preflight.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ILLUMIA_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ILLUMIA_ANDROID_KEYSTORE_B64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > apps/android/src-tauri/illumia.keystore
      - name: build web frontend
        working-directory: web
        run: |
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js
          npm run build
      - name: build signed APK
        working-directory: apps/android
        env:
          ILLUMIA_KEYSTORE_PASSWORD: ${{ secrets.ILLUMIA_ANDROID_KEYSTORE_PASSWORD }}
          ILLUMIA_KEY_ALIAS: ${{ secrets.ILLUMIA_ANDROID_KEY_ALIAS }}
        run: |
          npm ci
          npm run tauri android build -- --apk
          # TODO(M5): tauri.conf.json / gradle の署名設定と成果物パスを実装時に確定する
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: apps/android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # タグ push のとき、ビルドされた成果物を GitHub Release に添付する。
  # スキップされたコンポーネントがあっても、存在する成果物だけで Release を作る。
  publish-release:
    needs: [preflight, docker, desktop, android]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.desktop.result == 'success' || needs.android.result == 'success' || needs.docker.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # desktop/android が未実装でスキップされた場合は成果物ゼロなので失敗を許容する
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
