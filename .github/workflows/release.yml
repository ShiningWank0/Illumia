# 本番ビルド (配布物はここでのみ作る → docs/09)。
# タグ `v*` の push または手動実行 (workflow_dispatch) で起動する。
#
# 配布ゲート (docs/12: SEC-006 / SEC-007):
#   1. preflight でタグと全コンポーネントの version 一致を必須にする。
#   2. 同一 commit の CI (fmt/clippy/test/audit/web/ml/e2e/container scan) を
#      release から呼び出し、全成功後だけ publish する。
#   3. container は scan を通した digest だけを publish し、digest を記録する。
#   4. 未署名の desktop 成果物は GitHub Release へ添付しない (CI artifact 止まり)。
name: Release

on:
  push:
    tags: ['v*']
  # Manual runs are always dry-runs, even when the selected ref is an existing tag.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      docker_server: ${{ steps.check.outputs.docker_server }}
      docker_ml: ${{ steps.check.outputs.docker_ml }}
      desktop: ${{ steps.check.outputs.desktop }}
      android: ${{ steps.check.outputs.android }}
      version: ${{ steps.check.outputs.version }}
      commit_sha: ${{ steps.check.outputs.commit_sha }}
      owner_lc: ${{ steps.check.outputs.owner_lc }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: check
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          [ -f docker/Dockerfile.server ] && out docker_server true || out docker_server false
          [ -f docker/Dockerfile.ml ] && out docker_ml true || out docker_ml false
          [ -f crates/illumia-desktop/Cargo.toml ] && out desktop true || out desktop false
          [ -f apps/android/src-tauri/tauri.conf.json ] && out android true || out android false
          out commit_sha "$(git rev-parse HEAD)"
          # Docker のリポジトリ名は小文字必須 (owner に大文字が含まれるため変換)
          out owner_lc "${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            out version "${GITHUB_REF#refs/tags/}"
            out publish true
          else
            out version "dev-$(git rev-parse --short HEAD)"
            out publish false
          fi
      # タグと全 manifest の version 一致を必須にする (SEC-006)。
      # 不一致のまま publish すると、GHCR のタグと server が返す version がずれる。
      - name: verify component versions
        run: |
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            uv run --no-project scripts/check-versions.py --tag "${GITHUB_REF#refs/tags/}"
          else
            uv run --no-project scripts/check-versions.py
          fi

  # 同一 commit の CI をそのまま実行する。ここが落ちれば publish へ進まない (SEC-006)。
  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      full: true

  # tag / dry-run の同一commitへCodeQL 3言語を直接実行する。
  # mainの保護設定や過去runの状態には依存しない。
  codeql:
    needs: preflight
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  docker:
    needs: [preflight, ci]
    if: needs.preflight.outputs.docker_server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # digest を確実に記録するため直列化する。
      max-parallel: 1
      matrix:
        include:
          - image: illumia-server
            dockerfile: docker/Dockerfile.server
            trivyignore: .trivyignore.server.yaml
          - image: illumia-ml
            dockerfile: docker/Dockerfile.ml
            trivyignore: .trivyignore.ml.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: matrix.image == 'illumia-ml' && needs.preflight.outputs.docker_ml != 'true'
        run: echo "skip=1" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: env.skip != '1'
        with:
          version: v0.36.1

      - name: calculate image name
        id: image
        if: env.skip != '1'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.preflight.outputs.owner_lc }}/${{ matrix.image }}
        run: |
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # 手動実行はregistryへ一切書かず、release用Dockerfileのbuild/scanだけを検証する。
      - name: build dry-run image for scanning
        if: env.skip != '1' && needs.preflight.outputs.publish != 'true'
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:release-dry-run
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: verify dry-run MiniZip attack surface is absent
        if: >-
          matrix.image == 'illumia-server' &&
          needs.preflight.outputs.publish != 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE:release-dry-run" -ceu '
            ! command -v minizip
            ! command -v miniunzip
          '
      - name: scan dry-run image
        if: env.skip != '1' && needs.preflight.outputs.publish != 'true'
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:release-dry-run
          format: table
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: ${{ matrix.trivyignore }}
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 本番imageは一度だけbuildし、まずtag無しのcandidate digestとしてpushする。
      # version/latestはscan成功後まで作成しない。
      - name: build and push untagged candidate digest
        id: candidate
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.image.outputs.image }}
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: SOURCE_COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: verify candidate MiniZip attack surface is absent
        if: >-
          matrix.image == 'illumia-server' &&
          needs.preflight.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -ceu '
            ! command -v minizip
            ! command -v miniunzip
          '

      - name: scan candidate image by digest
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.candidate.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: ${{ matrix.trivyignore }}
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: record digest
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          MATRIX_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p digests
          echo "$IMAGE@$DIGEST" > "digests/$MATRIX_IMAGE.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        with:
          name: candidate-digest-${{ matrix.image }}
          path: digests/*

  # 検証済みbundleからdraft Releaseを作ってからprivate GHCRのdigestをpromotionし、
  # 全件のdigest一致を確認した最後にdraftを公開する。分散transaction途中の失敗は
  # 非公開draftとprivate GHCRに限定し、同一runのfailed job rerunで回復する。
  publish-release:
    needs: [preflight, prepare-release]
    if: >-
      always() &&
      needs.preflight.outputs.publish == 'true' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-release-bundle
          path: prepared
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-digest-*
          path: candidate-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: validate candidate digests and immutable version tags
        env:
          EXPECT_ML: ${{ needs.preflight.outputs.docker_ml }}
          IMAGE_OWNER: ${{ needs.preflight.outputs.owner_lc }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -f candidate-digests/illumia-server.txt
          if [ "$EXPECT_ML" = true ]; then
            test -f candidate-digests/illumia-ml.txt
          fi

          mapfile -t files < <(find candidate-digests -maxdepth 1 -type f \
            -name 'illumia-*.txt' -print | sort)
          expected=1
          [ "$EXPECT_ML" = true ] && expected=2
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::unexpected candidate digest count"
            exit 1
          fi

          : > promotion-plan.txt
          declare -A seen_images=()
          for file in "${files[@]}"; do
            ref=$(tr -d '\r\n' < "$file")
            image=${ref%@*}
            digest=${ref##*@}
            expected_image=$(basename "$file" .txt)
            if [[ ! "$image" =~ ^ghcr\.io/$IMAGE_OWNER/illumia-(server|ml)$ ]] ||
               [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
               [ "${image##*/}" != "$expected_image" ] ||
               [[ -n "${seen_images[$image]+present}" ]]; then
              echo "::error::invalid candidate digest record"
              exit 1
            fi
            seen_images[$image]=1
            printf '%s %s\n' "$image" "$digest" >> promotion-plan.txt
          done

          inspect_existing_digest() {
            local ref=$1
            local error_file=$2
            local output
            local attempt
            for attempt in 1 2 3; do
              if output=$(docker buildx imagetools inspect \
                  --format '{{json .Manifest.Digest}}' "$ref" 2>"$error_file"); then
                output=${output#\"}; output=${output%\"}
                printf '%s' "$output"
                return 0
              fi
              # GHCR may report a missing tag using either OCI's MANIFEST_UNKNOWN or HTTP 404.
              # Authentication, rate-limit, DNS, and other registry errors must fail closed.
              if grep -Eqi 'manifest unknown|manifest not found|no such manifest|unexpected status.*404' \
                   "$error_file" || grep -Fqi "$ref: not found" "$error_file"; then
                return 44
              fi
              [ "$attempt" -lt 3 ] && sleep "$((attempt * 2))"
            done
            cat "$error_file" >&2
            return 1
          }

          # どのversion tagも変更しないことを全件先に確認する。
          inspect_error=$(mktemp)
          trap 'rm -f "$inspect_error"' EXIT
          while read -r image digest extra; do
            if [ -n "${extra:-}" ]; then
              echo "::error::invalid promotion plan"; exit 1
            fi
            version_ref="$image:$VERSION"
            if existing=$(inspect_existing_digest "$version_ref" "$inspect_error"); then
              if [ "$existing" != "$digest" ]; then
                echo "::error::immutable version tag already points to a different digest"
                exit 1
              fi
            else
              status=$?
              if [ "$status" -ne 44 ]; then
                echo "::error::could not verify immutable version tag"
                exit "$status"
              fi
            fi
          done < promotion-plan.txt
          rm -f "$inspect_error"
          trap - EXIT
          if [ "$(wc -l < promotion-plan.txt)" -ne "$expected" ]; then
            echo "::error::invalid promotion plan count"; exit 1
          fi
          chmod 0444 promotion-plan.txt

      - name: verify tag still targets analyzed commit
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          response=$(mktemp)
          cleanup() { rm -f "$response"; }
          trap cleanup EXIT
          status=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --output "$response" --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $API_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION")
          if [ "$status" != 200 ]; then
            echo "::error::could not verify release tag ref"; exit 1
          fi
          object_type=$(jq -r '.object.type // ""' "$response")
          object_sha=$(jq -r '.object.sha // ""' "$response")
          for _depth in $(seq 1 8); do
            [ "$object_type" != tag ] && break
            status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --output "$response" --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $API_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$object_sha")
            if [ "$status" != 200 ]; then
              echo "::error::could not peel annotated release tag"; exit 1
            fi
            object_type=$(jq -r '.object.type // ""' "$response")
            object_sha=$(jq -r '.object.sha // ""' "$response")
          done
          if [ "$object_type" != commit ] || [ "$object_sha" != "$SOURCE_COMMIT" ]; then
            echo "::error::release tag no longer targets the analyzed commit"
            exit 1
          fi
          cleanup
          trap - EXIT

      # 公開済みReleaseをdraftへ戻したりassetを上書きしたりしない。
      # absentまたは同tagの非公開draftだけを許可する。
      - name: verify existing release state
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          response=$(mktemp)
          expected_assets=$(mktemp)
          existing_assets=$(mktemp)
          existing_body=$(mktemp)
          cleanup() {
            rm -f "$response" "$expected_assets" "$existing_assets" "$existing_body"
          }
          trap cleanup EXIT
          find prepared/release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$expected_assets"
          test -s "$expected_assets"
          found=0
          state=
          complete=false
          for page in $(seq 1 100); do
            status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --output "$response" --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $API_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page")
            if [ "$status" != 200 ] || ! jq -e 'type == "array"' "$response" >/dev/null; then
              echo "::error::could not verify existing release state"; exit 1
            fi
            count=$(jq 'length' "$response")
            matches=$(jq --arg version "$VERSION" \
              '[.[] | select(.tag_name == $version)] | length' "$response")
            if [ "$matches" -gt 1 ] || { [ "$matches" -eq 1 ] && [ "$found" -ne 0 ]; }; then
              echo "::error::duplicate release records for tag"; exit 1
            fi
            if [ "$matches" -eq 1 ]; then
              found=1
              state=$(jq -r --arg version "$VERSION" \
                '.[] | select(.tag_name == $version) | .draft' "$response")
              jq -r --arg version "$VERSION" \
                '.[] | select(.tag_name == $version) | .assets[].name' \
                "$response" | sort > "$existing_assets"
              jq -j --arg version "$VERSION" \
                '.[] | select(.tag_name == $version) | (.body // "")' \
                "$response" > "$existing_body"
            fi
            if [ "$count" -lt 100 ]; then
              complete=true
              break
            fi
          done
          if [ "$complete" != true ]; then
            echo "::error::release enumeration exceeded safety limit"; exit 1
          fi
          if [ "$found" -eq 1 ] && [ "$state" != true ]; then
            echo "::error::release for this tag is already published; refusing mutation"
            exit 1
          fi
          if [ "$found" -eq 1 ]; then
            if ! cmp -s "$existing_body" prepared/release-notes.md; then
              echo "::error::existing draft belongs to a different release candidate"
              exit 1
            fi
            if [ "$(sort -u "$existing_assets" | wc -l)" -ne "$(wc -l < "$existing_assets")" ] ||
               [ -n "$(comm -23 "$existing_assets" "$expected_assets")" ]; then
              echo "::error::existing draft contains unexpected release assets"
              exit 1
            fi
          fi
          cleanup
          trap - EXIT

      - name: create validated draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Illumia ${{ needs.preflight.outputs.version }}
          files: prepared/release-assets/*
          body_path: prepared/release-notes.md
          generate_release_notes: false
          draft: true
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: promote all scanned candidate digests
        env:
          IMAGE_OWNER: ${{ needs.preflight.outputs.owner_lc }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -f promotion-plan.txt

          # 単一source digestをcarbon-copyしてversion/latestへ付与する。
          while read -r image digest extra; do
            if [ -n "${extra:-}" ] ||
               [[ ! "$image" =~ ^ghcr\.io/$IMAGE_OWNER/illumia-(server|ml)$ ]] ||
               [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::invalid promotion plan"; exit 1
            fi
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:$VERSION" --tag "$image:latest" "$image@$digest"
            for tag in "$image:$VERSION" "$image:latest"; do
              actual=$(docker buildx imagetools inspect \
                --format '{{json .Manifest.Digest}}' "$tag")
              actual=${actual#\"}; actual=${actual%\"}
              if [ "$actual" != "$digest" ]; then
                echo "::error::promoted tag digest does not match scanned candidate"
                exit 1
              fi
            done
          done < promotion-plan.txt

      # draftを再利用し、検証済みassetを再照合・上書きしてから公開する。
      # promotion途中で失敗したrunではこのstepへ到達しない。
      - name: publish validated release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Illumia ${{ needs.preflight.outputs.version }}
          files: prepared/release-assets/*
          body_path: prepared/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true

  # 未署名バイナリは配布しない (SEC-007)。ビルド検証と CI artifact 保管のみ行い、
  # GitHub Release へは添付しない。署名・公証を導入したら publish 対象へ戻す。
  desktop:
    needs: [preflight, ci]
    if: needs.preflight.outputs.desktop == 'true'
    strategy:
      matrix:
        include:
          - os: macos-14 # Apple Silicon ランナー。x86_64 も cross ビルドし universal 化
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build (macOS universal)
        if: matrix.name == 'macos'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked -p illumia-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p illumia-desktop --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/illumia-desktop \
            target/x86_64-apple-darwin/release/illumia-desktop \
            -output dist/illumia-desktop-macos-universal
          # TODO: .app バンドル化・PyInstaller 製 ml サイドカー同梱・署名/公証。
          # 完了するまで GitHub Release へは添付しない (SEC-007)。
      - name: build (Windows)
        if: matrix.name == 'windows'
        run: |
          cargo build --release --locked -p illumia-desktop
          mkdir dist
          copy target\release\illumia-desktop.exe dist\illumia-desktop-windows-x64.exe
        shell: cmd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-desktop-${{ matrix.name }}
          path: dist/*

  android:
    needs: [preflight, ci]
    if: needs.preflight.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/android/src-tauri
      # full CI の Android gate と同一 lockfile が署名対象であることを build 直前にも確認する。
      - name: verify audited Android lockfile
        run: cargo metadata --manifest-path apps/android/src-tauri/Cargo.toml --locked --format-version 1 >/dev/null
      - name: build web frontend
        working-directory: web
        # npm ci はライフサイクルスクリプトを実行しない。esbuild 等の
        # optionalDependencies バイナリは npm ci が直接展開するので追加処理は不要。
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: install Tauri CLI
        working-directory: apps/android
        run: npm ci
      - name: initialize Android project (gen/ は非コミット)
        working-directory: apps/android
        # Rust ターゲットは rust-toolchain アクションで導入済みなので --skip-targets-install。
        run: npm run tauri android init -- --ci --skip-targets-install
      - name: build APK
        working-directory: apps/android
        run: npm run tauri android build -- --apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk-unsigned
          path: apps/android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # 依存package・Gradle pluginを実行するbuild jobへ署名鍵を渡さない。
  # CI済みのunsigned APKだけを、repository codeをcheckoutしない専用jobで署名する。
  android-sign:
    needs: [preflight, ci, codeql, android]
    if: >-
      needs.preflight.outputs.android == 'true' &&
      (needs.preflight.outputs.publish == 'true' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    # 署名secretは専用environmentへ隔離する。手動dry-runではdefault branchだけを署名し、
    # production keyを任意refの署名oracleにしない。
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk-unsigned
          path: unsigned
      - name: sign and verify audited APKs
        env:
          KEYSTORE_B64: ${{ secrets.ILLUMIA_ANDROID_KEYSTORE_B64 }}
          ILLUMIA_KEYSTORE_PASSWORD: ${{ secrets.ILLUMIA_ANDROID_KEYSTORE_PASSWORD }}
          ILLUMIA_KEY_ALIAS: ${{ secrets.ILLUMIA_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ILLUMIA_KEYSTORE_PASSWORD" ] || \
             [ -z "$ILLUMIA_KEY_ALIAS" ]; then
            echo "::error::Android signing secrets are not fully configured"; exit 1
          fi
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner が見つからない (build-tools 未導入)"; exit 1
          fi
          mapfile -d '' apks < <(find unsigned -type f -name '*.apk' -print0)
          if [ ${#apks[@]} -eq 0 ] || [ ${#apks[@]} -gt 4 ]; then
            echo "::error::署名対象APKの個数が不正"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > illumia.keystore
          chmod 600 illumia.keystore
          cleanup() { rm -f illumia.keystore certs.txt; }
          trap cleanup EXIT
          mkdir -p signed fingerprints
          out=fingerprints/android-apk.txt
          : > "$out"
          for apk in "${apks[@]}"; do
            size=$(stat -c '%s' "$apk")
            if [ "$size" -le 0 ] || [ "$size" -gt 536870912 ]; then
              echo "::error::署名対象APKのsizeが不正"; exit 1
            fi
            target_name=$(basename "$apk")
            if [[ ! "$target_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.apk$ ]]; then
              echo "::error::署名対象APKのfilenameが不正"; exit 1
            fi
            target="signed/$target_name"
            if [ -e "$target" ]; then
              echo "::error::同名APKが複数の入力directoryに存在する"; exit 1
            fi
            "$apksigner" sign \
              --ks illumia.keystore \
              --ks-pass env:ILLUMIA_KEYSTORE_PASSWORD \
              --ks-key-alias "$ILLUMIA_KEY_ALIAS" \
              --out "$target" "$apk"
            "$apksigner" verify --print-certs "$target" > certs.txt
            mapfile -t cert_sha_lines < <(
              grep -iE '^Signer #[0-9]+ certificate SHA-256 digest:' certs.txt || true
            )
            if [ "${#cert_sha_lines[@]}" -ne 1 ] ||
               [[ ! "${cert_sha_lines[0]}" =~ ^Signer\ \#1\ certificate\ SHA-256\ digest:\ ([0-9A-Fa-f]{64})$ ]]; then
              echo "::error::単一signerのSHA-256 fingerprintを取得できない"; exit 1
            fi
            cert_sha=${BASH_REMATCH[1]}
            apk_sha=$(sha256sum "$target" | cut -d' ' -f1)
            if [[ ! "$cert_sha" =~ ^[0-9A-Fa-f]{64}$ ]] ||
               [[ ! "$apk_sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::APK provenanceのSHA-256形式が不正"; exit 1
            fi
            # Public provenance contains no certificate DN or legacy SHA-1.
            printf 'file: %s\napk-sha256: %s\nsigning-certificate-sha256: %s\n\n' \
              "$target_name" "$apk_sha" "${cert_sha,,}" >> "$out"
          done
          cleanup
          trap - EXIT
          cat "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: |
            signed/*.apk
            fingerprints/*

  # 全build/scan/signの完了後、署名済み成果物とprovenanceをread-onlyで検証し、
  # promotion前に再利用可能なbundleへ固定する。未署名desktopは対象外 (SEC-007)。
  prepare-release:
    needs: [preflight, ci, codeql, docker, desktop, android, android-sign]
    if: >-
      always() && needs.preflight.outputs.publish == 'true' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.ci.result == 'success' &&
      needs.codeql.result == 'success' &&
      needs.docker.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.android.result == 'success' || needs.docker.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      # 配布対象を既知の署名済みAPKとprovenanceだけへallowlistする。
      # downloadした全artifactをそのままReleaseへ渡さない (SEC-007)。
      - name: stage allowlisted release assets
        env:
          EXPECT_ML: ${{ needs.preflight.outputs.docker_ml }}
          EXPECT_ANDROID: ${{ needs.preflight.outputs.android }}
        run: |
          set -euo pipefail
          mkdir release-assets

          # serverはreleaseの必須container。ML/Androidはpreflight結果と厳密に一致させる。
          server_digest=artifacts/candidate-digest-illumia-server/illumia-server.txt
          test -f "$server_digest"
          cp -- "$server_digest" release-assets/

          ml_digest=artifacts/candidate-digest-illumia-ml/illumia-ml.txt
          if [ "$EXPECT_ML" = true ]; then
            test -f "$ml_digest"
            cp -- "$ml_digest" release-assets/
          elif [ -e "$ml_digest" ]; then
            echo "::error::preflight対象外のML provenanceが存在する"; exit 1
          fi

          apks=()
          if [ -d artifacts/android-apk/signed ]; then
            mapfile -d '' apks < <(
              find artifacts/android-apk/signed -maxdepth 1 -type f -name '*.apk' -print0
            )
          fi
          fingerprint_source=artifacts/android-apk/fingerprints/android-apk.txt
          if [ "$EXPECT_ANDROID" = true ]; then
            if [ "${#apks[@]}" -eq 0 ] || [ "${#apks[@]}" -gt 4 ] ||
               [ ! -f "$fingerprint_source" ]; then
              echo "::error::Android release artifactが不足または過剰"; exit 1
            fi
            cp -- "$fingerprint_source" release-assets/
          elif [ "${#apks[@]}" -ne 0 ] || [ -e "$fingerprint_source" ]; then
            echo "::error::preflight対象外のAndroid artifactが存在する"; exit 1
          fi
          if [ "${#apks[@]}" -gt 4 ]; then
            echo "::error::配布対象APKの個数が不正"; exit 1
          fi

          expected_pairs=$(mktemp)
          recorded_pairs=$(mktemp)
          expected_sorted=$(mktemp)
          recorded_sorted=$(mktemp)
          cleanup() {
            rm -f "$expected_pairs" "$recorded_pairs" "$expected_sorted" "$recorded_sorted"
          }
          trap cleanup EXIT
          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.apk$ ]] ||
               [ -e "release-assets/$name" ]; then
              echo "::error::配布対象APKのfilenameが不正または重複"; exit 1
            fi
            apk_sha=$(sha256sum "$apk" | cut -d' ' -f1)
            printf '%s %s\n' "$name" "$apk_sha" >> "$expected_pairs"
            cp -- "$apk" release-assets/
          done

          if [ "$EXPECT_ANDROID" = true ]; then
            awk '
              function bad() { exit 2 }
              /^file: / {
                if (state != 0) bad()
                file = substr($0, 7)
                if (file !~ /^[A-Za-z0-9][A-Za-z0-9._-]*\.apk$/) bad()
                state = 1; next
              }
              /^apk-sha256: / {
                if (state != 1) bad()
                sha = substr($0, 13)
                if (length(sha) != 64 || sha !~ /^[0-9a-f]+$/) bad()
                print file " " sha
                state = 2; next
              }
              /^signing-certificate-sha256: / {
                if (state != 2) bad()
                sha = substr($0, 29)
                if (length(sha) != 64 || sha !~ /^[0-9a-f]+$/) bad()
                state = 3; next
              }
              /^$/ {
                if (state == 0) next
                if (state != 3) bad()
                state = 0; next
              }
              { bad() }
              END { if (state != 0 && state != 3) bad() }
            ' "$fingerprint_source" > "$recorded_pairs"
            sort -u "$expected_pairs" > "$expected_sorted"
            sort -u "$recorded_pairs" > "$recorded_sorted"
            if [ "$(wc -l < "$recorded_sorted")" -ne "${#apks[@]}" ] ||
               ! cmp -s "$expected_sorted" "$recorded_sorted"; then
              echo "::error::署名済みAPKとfingerprint recordが一致しない"; exit 1
            fi
          fi
          cleanup
          trap - EXIT
          find release-assets -maxdepth 1 -type f -print | sort
      - name: collect provenance records
        run: |
          set -euo pipefail
          : > provenance.txt
          for record in release-assets/illumia-server.txt \
            release-assets/illumia-ml.txt release-assets/android-apk.txt; do
            [ ! -f "$record" ] || cat -- "$record" >> provenance.txt
          done
          test -s provenance.txt
          cat provenance.txt
      - name: compose provenance notes
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit_sha }}
        run: |
          {
            echo "## 配布物の同一性"
            echo
            echo "- tag: \`${GITHUB_REF#refs/tags/}\`"
            echo "- commit: \`$SOURCE_COMMIT\`"
            echo
            # allowlistでstage・検証したprovenanceだけを公開する。
            if [ -s provenance.txt ]; then
              echo '### container image digest / APK fingerprint'
              echo
              echo '```'
              cat provenance.txt
              echo '```'
            fi
            echo
            echo "未署名の macOS / Windows デスクトップバイナリは配布対象外です"
            echo "(署名・公証の導入まで CI artifact 止まり → docs/12 SEC-007)。"
            echo
            echo "## 実環境ゲート"
            echo
            echo "公開前の実環境確認はCIでは代替できません。tag作成者はdocs/15のAを"
            echo "完了してからtagをpushしてください。このworkflow実行がBです。"
            echo "endpoint等の機密情報は公開しません。"
            echo "公開後はdocs/15のCでdigest、APK、GHCR権限、repository visibilityを照合し、"
            echo "Cが成功するまでreleaseを完了扱いにしません。"
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-release-bundle
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error
          retention-days: 1
