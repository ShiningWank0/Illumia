# 本番ビルド (配布物はここでのみ作る → docs/09)。
# タグ `v*` の push または手動実行 (workflow_dispatch) で起動する。
#
# 配布ゲート (docs/12: SEC-006 / SEC-007):
#   1. preflight でタグと全コンポーネントの version 一致を必須にする。
#   2. 同一 commit の CI (fmt/clippy/test/audit/web/ml/e2e/container scan) を
#      release から呼び出し、全成功後だけ publish する。
#   3. container は scan を通した digest だけを publish し、digest を記録する。
#   4. 未署名の desktop 成果物は GitHub Release へ添付しない (CI artifact 止まり)。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '成果物を公開せずビルドだけ検証する'
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      docker_server: ${{ steps.check.outputs.docker_server }}
      docker_ml: ${{ steps.check.outputs.docker_ml }}
      desktop: ${{ steps.check.outputs.desktop }}
      android: ${{ steps.check.outputs.android }}
      version: ${{ steps.check.outputs.version }}
      owner_lc: ${{ steps.check.outputs.owner_lc }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: check
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          [ -f docker/Dockerfile.server ] && out docker_server true || out docker_server false
          [ -f docker/Dockerfile.ml ] && out docker_ml true || out docker_ml false
          [ -f crates/illumia-desktop/Cargo.toml ] && out desktop true || out desktop false
          [ -f apps/android/src-tauri/tauri.conf.json ] && out android true || out android false
          # Docker のリポジトリ名は小文字必須 (owner に大文字が含まれるため変換)
          out owner_lc "${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            out version "${GITHUB_REF#refs/tags/}"
            out publish true
          else
            out version "dev-$(git rev-parse --short HEAD)"
            out publish false
          fi
      # タグと全 manifest の version 一致を必須にする (SEC-006)。
      # 不一致のまま publish すると、GHCR のタグと server が返す version がずれる。
      - name: verify component versions
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            uv run --no-project scripts/check-versions.py --tag "${GITHUB_REF#refs/tags/}"
          else
            uv run --no-project scripts/check-versions.py
          fi

  # 同一 commit の CI をそのまま実行する。ここが落ちれば publish へ進まない (SEC-006)。
  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      full: true

  docker:
    needs: [preflight, ci]
    if: needs.preflight.outputs.docker_server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server_digest: ${{ steps.record.outputs.illumia-server }}
      ml_digest: ${{ steps.record.outputs.illumia-ml }}
    strategy:
      # digest を確実に記録するため直列化する。
      max-parallel: 1
      matrix:
        include:
          - image: illumia-server
            dockerfile: docker/Dockerfile.server
          - image: illumia-ml
            dockerfile: docker/Dockerfile.ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.image == 'illumia-ml' && needs.preflight.outputs.docker_ml != 'true'
        run: echo "skip=1" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        if: env.skip != '1'

      # scan 前に registry へ push しない。まずローカルへ load して Trivy を通す。
      - name: build for scanning
        if: env.skip != '1'
        env:
          # build record (*.dockerbuild) を artifact として上げない。
          # Release に無関係なファイルが混ざるのを防ぐ。
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:scan
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: scan ${{ matrix.image }}
        if: env.skip != '1'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: calculate immutable and stable tags
        id: image
        if: env.skip != '1'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.preflight.outputs.owner_lc }}/${{ matrix.image }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$VERSION"
            # latest はタグ push (= release 成功経路) のときだけ更新する。
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "$IMAGE:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      # scan を通った同一 context を push する。digest を release notes へ記録する。
      - name: push scanned image
        id: push
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
      # push した実 image を digest 指定で再 scan する。scan 済み context と
      # 実際に配布される image が一致していることを、配布物側から確認する
      # (docs/12 の公開前チェック)。
      - name: rescan published image by digest
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: record digest
        id: record
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        run: |
          echo "${{ matrix.image }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          mkdir -p digests
          echo "${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}" \
            > "digests/${{ matrix.image }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        with:
          name: digest-${{ matrix.image }}
          path: digests/*

  # 未署名バイナリは配布しない (SEC-007)。ビルド検証と CI artifact 保管のみ行い、
  # GitHub Release へは添付しない。署名・公証を導入したら publish 対象へ戻す。
  desktop:
    needs: [preflight, ci]
    if: needs.preflight.outputs.desktop == 'true'
    strategy:
      matrix:
        include:
          - os: macos-14 # Apple Silicon ランナー。x86_64 も cross ビルドし universal 化
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build (macOS universal)
        if: matrix.name == 'macos'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked -p illumia-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p illumia-desktop --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/illumia-desktop \
            target/x86_64-apple-darwin/release/illumia-desktop \
            -output dist/illumia-desktop-macos-universal
          # TODO: .app バンドル化・PyInstaller 製 ml サイドカー同梱・署名/公証。
          # 完了するまで GitHub Release へは添付しない (SEC-007)。
      - name: build (Windows)
        if: matrix.name == 'windows'
        run: |
          cargo build --release --locked -p illumia-desktop
          mkdir dist
          copy target\release\illumia-desktop.exe dist\illumia-desktop-windows-x64.exe
        shell: cmd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-desktop-${{ matrix.name }}
          path: dist/*

  android:
    needs: [preflight, ci]
    if: needs.preflight.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/android/src-tauri
      - name: restore signing keystore
        if: needs.preflight.outputs.publish == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ILLUMIA_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ILLUMIA_ANDROID_KEYSTORE_B64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > apps/android/src-tauri/illumia.keystore
      - name: build web frontend
        working-directory: web
        # npm ci はライフサイクルスクリプトを実行しない。esbuild 等の
        # optionalDependencies バイナリは npm ci が直接展開するので追加処理は不要。
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: install Tauri CLI
        working-directory: apps/android
        run: npm ci
      - name: initialize Android project (gen/ は非コミット)
        working-directory: apps/android
        # Rust ターゲットは rust-toolchain アクションで導入済みなので --skip-targets-install。
        run: npm run tauri android init -- --ci --skip-targets-install
      - name: configure release signing
        if: needs.preflight.outputs.publish == 'true'
        working-directory: apps/android/src-tauri/gen/android
        env:
          ILLUMIA_KEYSTORE_PASSWORD: ${{ secrets.ILLUMIA_ANDROID_KEYSTORE_PASSWORD }}
          ILLUMIA_KEY_ALIAS: ${{ secrets.ILLUMIA_ANDROID_KEY_ALIAS }}
        run: |
          # keystore.properties を生成し、生成された app/build.gradle.kts に署名設定を注入する。
          cat > keystore.properties <<EOF
          password=$ILLUMIA_KEYSTORE_PASSWORD
          keyAlias=$ILLUMIA_KEY_ALIAS
          storeFile=$(cd ../.. && pwd)/illumia.keystore
          EOF
          # Python は必ず uv 経由 (AGENTS.md 6)。
          uv run --no-project "$GITHUB_WORKSPACE/apps/android/scripts/inject-signing.py" \
            app/build.gradle.kts
      - name: build APK
        working-directory: apps/android
        run: npm run tauri android build -- --apk
      # 配布物の同一性を release notes へ記録する (SEC-007)。
      - name: record APK fingerprints
        if: needs.preflight.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # apksigner は build-tools に含まれる。glob が外れて黙って
          # "certs: unavailable" を書くことがあったため、明示的に探して
          # 見つからなければ失敗させる (SEC-007 の記録要件)。
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner が見つからない (build-tools 未導入)"; exit 1
          fi
          echo "using: $apksigner"

          mkdir -p fingerprints
          out=fingerprints/android-apk.txt
          : > "$out"
          mapfile -d '' apks < <(
            find apps/android/src-tauri/gen/android/app/build/outputs/apk \
              -name '*.apk' -print0
          )
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::APK が見つからない"; exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "file: $(basename "$apk")" >> "$out"
            echo "sha256: $(sha256sum "$apk" | cut -d' ' -f1)" >> "$out"
            # 署名の検証と証明書 fingerprint。失敗したら release を止める。
            if ! "$apksigner" verify --print-certs "$apk" > /tmp/certs.txt 2>&1; then
              echo "::error::APK の署名検証に失敗した: $apk"; cat /tmp/certs.txt; exit 1
            fi
            grep -iE 'SHA-256 digest|SHA-1 digest|Signer #1 certificate DN' /tmp/certs.txt \
              >> "$out"
            echo >> "$out"
          done
          if grep -qi 'unavailable' "$out"; then
            echo "::error::証明書 fingerprint を記録できていない"; exit 1
          fi
          cat "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: |
            apps/android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            fingerprints/*

  # タグ push のとき、署名済み成果物だけを GitHub Release に添付する。
  # 未署名 desktop バイナリは対象外 (SEC-007)。
  publish-release:
    needs: [preflight, ci, docker, desktop, android]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.ci.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.android.result == 'success' || needs.docker.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          path: artifacts
      # 未署名 desktop バイナリは配布対象外 (SEC-007)。負の glob に頼らず、
      # 取得後に明示的に削除し、残っていないことを検証してから添付する。
      - name: drop unsigned desktop artifacts
        run: |
          rm -rf artifacts/unsigned-desktop-* || true
          # docker build record は配布物ではないので添付しない。
          find artifacts -name '*.dockerbuild' -delete 2>/dev/null || true
          if compgen -G 'artifacts/unsigned-desktop-*' > /dev/null; then
            echo "::error::未署名 desktop 成果物を除外できていない"; exit 1
          fi
          # 実行ファイル形式が紛れ込んでいないことも確認する。
          if find artifacts -type f \( -name '*.exe' -o -name '*-macos-universal' \) \
              | grep -q .; then
            echo "::error::未署名の実行ファイルが配布対象に含まれている"; exit 1
          fi
          find artifacts -type f | sort
      - name: collect provenance records
        run: |
          # digest / fingerprint は artifact 名のサブディレクトリ配下にある。
          find artifacts -type f -name '*.txt' -exec cat {} + > provenance.txt || true
          if [ ! -s provenance.txt ]; then
            echo "::error::image digest / APK fingerprint を回収できていない (SEC-007)"
            exit 1
          fi
          cat provenance.txt
      - name: compose provenance notes
        run: |
          {
            echo "## 配布物の同一性"
            echo
            echo "- tag: \`${GITHUB_REF#refs/tags/}\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo
            # download-artifact は artifact 名のサブディレクトリへ展開するので、
            # トップレベルの glob では拾えない。再帰的に探す。
            if [ -s provenance.txt ]; then
              echo '### container image digest / APK fingerprint'
              echo
              echo '```'
              cat provenance.txt
              echo '```'
            fi
            echo
            echo "未署名の macOS / Windows デスクトップバイナリは配布対象外です"
            echo "(署名・公証の導入まで CI artifact 止まり → docs/12 SEC-007)。"
            echo
            echo "## インターネット公開前に必要な未実施の検証"
            echo
            echo "コード側の防御は CI で継続検証していますが、**設置環境に対する"
            echo "次の検証は未実施**です。インターネットへ公開する前に必ず実施してください"
            echo "(詳細: docs/12_security.md)。"
            echo
            echo "- Pangolin/Newt 配下の外部回線からの adversarial test"
            echo "- 外部回線から origin IP / host port へ直接到達できないことの IPv4/IPv6 確認"
            echo "- 配布 APK の実機動作と署名証明書 fingerprint の確認"
            echo "- reverse proxy の timeout / rate limit / sensitive header ログ除外の確認"
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/**/*
          body_path: release-notes.md
          generate_release_notes: true
