# 本番ビルド (配布物はここでのみ作る → docs/09)。
# タグ `v*` の push または手動実行 (workflow_dispatch) で起動する。
#
# 配布ゲート (docs/12: SEC-006 / SEC-007):
#   1. preflight でタグと全コンポーネントの version 一致を必須にする。
#   2. 同一 commit の CI (fmt/clippy/test/audit/web/ml/e2e/container scan) を
#      release から呼び出し、全成功後だけ publish する。
#   3. container は scan を通した digest だけを publish し、digest を記録する。
#   4. 未署名の desktop 成果物は GitHub Release へ添付しない (CI artifact 止まり)。
name: Release

on:
  push:
    tags: ['v*']
  # Manual runs are always dry-runs, even when the selected ref is an existing tag.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      docker_server: ${{ steps.check.outputs.docker_server }}
      docker_ml: ${{ steps.check.outputs.docker_ml }}
      desktop: ${{ steps.check.outputs.desktop }}
      android: ${{ steps.check.outputs.android }}
      version: ${{ steps.check.outputs.version }}
      owner_lc: ${{ steps.check.outputs.owner_lc }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: check
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          [ -f docker/Dockerfile.server ] && out docker_server true || out docker_server false
          [ -f docker/Dockerfile.ml ] && out docker_ml true || out docker_ml false
          [ -f crates/illumia-desktop/Cargo.toml ] && out desktop true || out desktop false
          [ -f apps/android/src-tauri/tauri.conf.json ] && out android true || out android false
          # Docker のリポジトリ名は小文字必須 (owner に大文字が含まれるため変換)
          out owner_lc "${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            out version "${GITHUB_REF#refs/tags/}"
            out publish true
          else
            out version "dev-$(git rev-parse --short HEAD)"
            out publish false
          fi
      # タグと全 manifest の version 一致を必須にする (SEC-006)。
      # 不一致のまま publish すると、GHCR のタグと server が返す version がずれる。
      - name: verify component versions
        run: |
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            uv run --no-project scripts/check-versions.py --tag "${GITHUB_REF#refs/tags/}"
          else
            uv run --no-project scripts/check-versions.py
          fi

  # 同一 commit の CI をそのまま実行する。ここが落ちれば publish へ進まない (SEC-006)。
  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      full: true

  docker:
    needs: [preflight, ci]
    if: needs.preflight.outputs.docker_server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # digest を確実に記録するため直列化する。
      max-parallel: 1
      matrix:
        include:
          - image: illumia-server
            dockerfile: docker/Dockerfile.server
            trivyignore: .trivyignore.server.yaml
          - image: illumia-ml
            dockerfile: docker/Dockerfile.ml
            trivyignore: .trivyignore.ml.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: matrix.image == 'illumia-ml' && needs.preflight.outputs.docker_ml != 'true'
        run: echo "skip=1" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: env.skip != '1'
        with:
          version: v0.36.1

      - name: calculate image name
        id: image
        if: env.skip != '1'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.preflight.outputs.owner_lc }}/${{ matrix.image }}
        run: |
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # 手動実行はregistryへ一切書かず、release用Dockerfileのbuild/scanだけを検証する。
      - name: build dry-run image for scanning
        if: env.skip != '1' && needs.preflight.outputs.publish != 'true'
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:release-dry-run
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: verify dry-run MiniZip attack surface is absent
        if: >-
          matrix.image == 'illumia-server' &&
          needs.preflight.outputs.publish != 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE:release-dry-run" -ceu '
            ! command -v minizip
            ! command -v miniunzip
          '
      - name: scan dry-run image
        if: env.skip != '1' && needs.preflight.outputs.publish != 'true'
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:release-dry-run
          format: table
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: ${{ matrix.trivyignore }}
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 本番imageは一度だけbuildし、まずtag無しのcandidate digestとしてpushする。
      # version/latestはscan成功後まで作成しない。
      - name: build and push untagged candidate digest
        id: candidate
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.image.outputs.image }}
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: SOURCE_COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: verify candidate MiniZip attack surface is absent
        if: >-
          matrix.image == 'illumia-server' &&
          needs.preflight.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -ceu '
            ! command -v minizip
            ! command -v miniunzip
          '

      - name: scan candidate image by digest
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.candidate.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: ${{ matrix.trivyignore }}
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: record digest
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          MATRIX_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p digests
          echo "$IMAGE@$DIGEST" > "digests/$MATRIX_IMAGE.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.skip != '1' && needs.preflight.outputs.publish == 'true'
        with:
          name: candidate-digest-${{ matrix.image }}
          path: digests/*

  # 全build/scan/sign成功後、公開担当者がdocs/12の実環境gateを確認する。
  # environmentにrequired reviewerを設定し、promotion/Release作成を承認前に止める。
  release-approval:
    name: Production release approval
    needs: [preflight, ci, docker, desktop, android, android-sign]
    if: >-
      always() &&
      needs.preflight.outputs.publish == 'true' &&
      needs.ci.result == 'success' &&
      needs.docker.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: release-production
    permissions: {}
    steps:
      - name: record approval
        run: echo "Production release approved after external gate review"

  # 全imageのcandidate scanと他の配布build/sign、公開承認の成功後だけ、
  # 単一jobが同じdigestへrelease tagを付ける。途中失敗でcontainerだけが公開される
  # 状態を作らない。
  docker-promote:
    needs: [preflight, ci, docker, desktop, android, android-sign, release-approval]
    if: >-
      always() &&
      needs.preflight.outputs.publish == 'true' &&
      needs.ci.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.release-approval.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-digest-*
          path: candidate-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: promote all scanned candidate digests
        env:
          EXPECT_ML: ${{ needs.preflight.outputs.docker_ml }}
          IMAGE_OWNER: ${{ needs.preflight.outputs.owner_lc }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -f candidate-digests/illumia-server.txt
          if [ "$EXPECT_ML" = true ]; then
            test -f candidate-digests/illumia-ml.txt
          fi

          mapfile -t files < <(find candidate-digests -maxdepth 1 -type f \
            -name 'illumia-*.txt' -print | sort)
          expected=1
          [ "$EXPECT_ML" = true ] && expected=2
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::unexpected candidate digest count"
            exit 1
          fi

          images=()
          digests=()
          declare -A seen_images=()
          for file in "${files[@]}"; do
            ref=$(tr -d '\r\n' < "$file")
            image=${ref%@*}
            digest=${ref##*@}
            expected_image=$(basename "$file" .txt)
            if [[ ! "$image" =~ ^ghcr\.io/$IMAGE_OWNER/illumia-(server|ml)$ ]] ||
               [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
               [ "${image##*/}" != "$expected_image" ] ||
               [[ -n "${seen_images[$image]+present}" ]]; then
              echo "::error::invalid candidate digest record"
              exit 1
            fi
            seen_images[$image]=1
            images+=("$image")
            digests+=("$digest")
          done

          inspect_existing_digest() {
            local ref=$1
            local error_file=$2
            local output
            local attempt
            for attempt in 1 2 3; do
              if output=$(docker buildx imagetools inspect \
                  --format '{{json .Manifest.Digest}}' "$ref" 2>"$error_file"); then
                output=${output#\"}; output=${output%\"}
                printf '%s' "$output"
                return 0
              fi
              # GHCR may report a missing tag using either OCI's MANIFEST_UNKNOWN or HTTP 404.
              # Authentication, rate-limit, DNS, and other registry errors must fail closed.
              if grep -Eqi 'manifest unknown|manifest not found|no such manifest|unexpected status.*404' \
                   "$error_file" || grep -Fqi "$ref: not found" "$error_file"; then
                return 44
              fi
              [ "$attempt" -lt 3 ] && sleep "$((attempt * 2))"
            done
            cat "$error_file" >&2
            return 1
          }

          # どのversion tagも変更しないことを全件先に確認する。
          inspect_error=$(mktemp)
          trap 'rm -f "$inspect_error"' EXIT
          for index in "${!images[@]}"; do
            version_ref="${images[$index]}:$VERSION"
            if existing=$(inspect_existing_digest "$version_ref" "$inspect_error"); then
              if [ "$existing" != "${digests[$index]}" ]; then
                echo "::error::immutable version tag already points to a different digest"
                exit 1
              fi
            else
              status=$?
              if [ "$status" -ne 44 ]; then
                echo "::error::could not verify immutable version tag"
                exit "$status"
              fi
            fi
          done
          rm -f "$inspect_error"
          trap - EXIT

          # 単一source digestをcarbon-copyしてversion/latestへ付与する。
          for index in "${!images[@]}"; do
            image=${images[$index]}
            digest=${digests[$index]}
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:$VERSION" --tag "$image:latest" "$image@$digest"
            for tag in "$image:$VERSION" "$image:latest"; do
              actual=$(docker buildx imagetools inspect \
                --format '{{json .Manifest.Digest}}' "$tag")
              actual=${actual#\"}; actual=${actual%\"}
              if [ "$actual" != "$digest" ]; then
                echo "::error::promoted tag digest does not match scanned candidate"
                exit 1
              fi
            done
          done

  # 未署名バイナリは配布しない (SEC-007)。ビルド検証と CI artifact 保管のみ行い、
  # GitHub Release へは添付しない。署名・公証を導入したら publish 対象へ戻す。
  desktop:
    needs: [preflight, ci]
    if: needs.preflight.outputs.desktop == 'true'
    strategy:
      matrix:
        include:
          - os: macos-14 # Apple Silicon ランナー。x86_64 も cross ビルドし universal 化
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build (macOS universal)
        if: matrix.name == 'macos'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked -p illumia-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p illumia-desktop --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/illumia-desktop \
            target/x86_64-apple-darwin/release/illumia-desktop \
            -output dist/illumia-desktop-macos-universal
          # TODO: .app バンドル化・PyInstaller 製 ml サイドカー同梱・署名/公証。
          # 完了するまで GitHub Release へは添付しない (SEC-007)。
      - name: build (Windows)
        if: matrix.name == 'windows'
        run: |
          cargo build --release --locked -p illumia-desktop
          mkdir dist
          copy target\release\illumia-desktop.exe dist\illumia-desktop-windows-x64.exe
        shell: cmd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-desktop-${{ matrix.name }}
          path: dist/*

  android:
    needs: [preflight, ci]
    if: needs.preflight.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/android/src-tauri
      # full CI の Android gate と同一 lockfile が署名対象であることを build 直前にも確認する。
      - name: verify audited Android lockfile
        run: cargo metadata --manifest-path apps/android/src-tauri/Cargo.toml --locked --format-version 1 >/dev/null
      - name: build web frontend
        working-directory: web
        # npm ci はライフサイクルスクリプトを実行しない。esbuild 等の
        # optionalDependencies バイナリは npm ci が直接展開するので追加処理は不要。
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: install Tauri CLI
        working-directory: apps/android
        run: npm ci
      - name: initialize Android project (gen/ は非コミット)
        working-directory: apps/android
        # Rust ターゲットは rust-toolchain アクションで導入済みなので --skip-targets-install。
        run: npm run tauri android init -- --ci --skip-targets-install
      - name: build APK
        working-directory: apps/android
        run: npm run tauri android build -- --apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk-unsigned
          path: apps/android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # 依存package・Gradle pluginを実行するbuild jobへ署名鍵を渡さない。
  # CI済みのunsigned APKだけを、repository codeをcheckoutしない専用jobで署名する。
  android-sign:
    needs: [preflight, ci, android]
    if: >-
      needs.preflight.outputs.android == 'true' &&
      needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # 署名secretは専用environmentへ隔離する。Repository settingsでこのenvironmentに
    # release担当者のapproval ruleを設定する。
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk-unsigned
          path: unsigned
      - name: sign and verify audited APKs
        env:
          KEYSTORE_B64: ${{ secrets.ILLUMIA_ANDROID_KEYSTORE_B64 }}
          ILLUMIA_KEYSTORE_PASSWORD: ${{ secrets.ILLUMIA_ANDROID_KEYSTORE_PASSWORD }}
          ILLUMIA_KEY_ALIAS: ${{ secrets.ILLUMIA_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ILLUMIA_KEYSTORE_PASSWORD" ] || \
             [ -z "$ILLUMIA_KEY_ALIAS" ]; then
            echo "::error::Android signing secrets are not fully configured"; exit 1
          fi
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner が見つからない (build-tools 未導入)"; exit 1
          fi
          mapfile -d '' apks < <(find unsigned -type f -name '*.apk' -print0)
          if [ ${#apks[@]} -eq 0 ] || [ ${#apks[@]} -gt 4 ]; then
            echo "::error::署名対象APKの個数が不正"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > illumia.keystore
          chmod 600 illumia.keystore
          cleanup() { rm -f illumia.keystore certs.txt; }
          trap cleanup EXIT
          mkdir -p signed fingerprints
          out=fingerprints/android-apk.txt
          : > "$out"
          for apk in "${apks[@]}"; do
            size=$(stat -c '%s' "$apk")
            if [ "$size" -le 0 ] || [ "$size" -gt 536870912 ]; then
              echo "::error::署名対象APKのsizeが不正"; exit 1
            fi
            target="signed/$(basename "$apk")"
            if [ -e "$target" ]; then
              echo "::error::同名APKが複数の入力directoryに存在する"; exit 1
            fi
            "$apksigner" sign \
              --ks illumia.keystore \
              --ks-pass env:ILLUMIA_KEYSTORE_PASSWORD \
              --ks-key-alias "$ILLUMIA_KEY_ALIAS" \
              --out "$target" "$apk"
            "$apksigner" verify --print-certs "$target" > certs.txt
            echo "file: $(basename "$target")" >> "$out"
            echo "sha256: $(sha256sum "$target" | cut -d' ' -f1)" >> "$out"
            grep -iE 'SHA-256 digest|SHA-1 digest|Signer #1 certificate DN' certs.txt \
              >> "$out"
            echo >> "$out"
          done
          cleanup
          trap - EXIT
          cat "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: |
            signed/*.apk
            fingerprints/*

  # タグ push のとき、署名済み成果物だけを GitHub Release に添付する。
  # 未署名 desktop バイナリは対象外 (SEC-007)。
  publish-release:
    needs: [preflight, ci, docker, docker-promote, desktop, android, android-sign, release-approval]
    if: >-
      always() && needs.preflight.outputs.publish == 'true' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.ci.result == 'success' &&
      needs.release-approval.result == 'success' &&
      needs.docker-promote.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.android.result == 'success' || needs.docker.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          path: artifacts
      # 未署名 desktop バイナリは配布対象外 (SEC-007)。負の glob に頼らず、
      # 取得後に明示的に削除し、残っていないことを検証してから添付する。
      - name: drop unsigned desktop artifacts
        run: |
          rm -rf artifacts/unsigned-desktop-* || true
          # build jobのAPKは署名jobへの入力専用。Releaseへ添付するのは
          # android-sign jobが生成した検証済みartifactだけに限定する。
          rm -rf artifacts/android-apk-unsigned || true
          # docker build record は配布物ではないので添付しない。
          find artifacts -name '*.dockerbuild' -delete 2>/dev/null || true
          if compgen -G 'artifacts/unsigned-desktop-*' > /dev/null; then
            echo "::error::未署名 desktop 成果物を除外できていない"; exit 1
          fi
          # 実行ファイル形式が紛れ込んでいないことも確認する。
          if find artifacts -type f \( -name '*.exe' -o -name '*-macos-universal' \) \
              | grep -q .; then
            echo "::error::未署名の実行ファイルが配布対象に含まれている"; exit 1
          fi
          if find artifacts -type f -name '*.apk' \
              ! -path 'artifacts/android-apk/*' | grep -q .; then
            echo "::error::署名job外のAPKが配布対象に含まれている"; exit 1
          fi
          find artifacts -type f | sort
      - name: collect provenance records
        run: |
          # digest / fingerprint は artifact 名のサブディレクトリ配下にある。
          find artifacts -type f -name '*.txt' -exec cat {} + > provenance.txt || true
          if [ ! -s provenance.txt ]; then
            echo "::error::image digest / APK fingerprint を回収できていない (SEC-007)"
            exit 1
          fi
          cat provenance.txt
      - name: compose provenance notes
        run: |
          {
            echo "## 配布物の同一性"
            echo
            echo "- tag: \`${GITHUB_REF#refs/tags/}\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo
            # download-artifact は artifact 名のサブディレクトリへ展開するので、
            # トップレベルの glob では拾えない。再帰的に探す。
            if [ -s provenance.txt ]; then
              echo '### container image digest / APK fingerprint'
              echo
              echo '```'
              cat provenance.txt
              echo '```'
            fi
            echo
            echo "未署名の macOS / Windows デスクトップバイナリは配布対象外です"
            echo "(署名・公証の導入まで CI artifact 止まり → docs/12 SEC-007)。"
            echo
            echo "## インターネット公開前に必要な未実施の検証"
            echo
            echo "コード側の防御は CI で継続検証していますが、**設置環境に対する"
            echo "次の検証は未実施**です。インターネットへ公開する前に必ず実施してください"
            echo "(詳細: docs/12_security.md)。"
            echo
            echo "- Pangolin/Newt 配下の外部回線からの adversarial test"
            echo "- 外部回線から origin IP / host port へ直接到達できないことの IPv4/IPv6 確認"
            echo "- 配布 APK の実機動作と署名証明書 fingerprint の確認"
            echo "- reverse proxy の timeout / rate limit / sensitive header ログ除外の確認"
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/**/*
          body_path: release-notes.md
          generate_release_notes: true
