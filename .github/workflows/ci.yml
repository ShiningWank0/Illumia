# CI: push / PR で変更のあったコンポーネントのみ lint + test を実行する。
# docs のみの変更でも必ず green になる (集約ジョブ ci-ok を必須チェックにする)。
# 仕様: docs/09_dev_workflow.md
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      ml: ${{ steps.filter.outputs.ml }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - '.github/workflows/**'
            ml:
              - 'ml/**'
              - '.github/workflows/**'
            docker:
              - '.dockerignore'
              - 'docker/**'
              - 'crates/**'
              - 'web/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install without arbitrary lifecycle scripts
        run: |
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js
      - name: dependency audit
        run: npm audit --audit-level=high
      - name: lint / check
        run: |
          npm run lint --if-present
          npm run check --if-present
      - name: test
        run: npm test --if-present
      - name: build
        run: npm run build

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: |
          if [ -d tests ]; then uv run pytest; else echo "no tests yet"; fi

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: validate compose
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml config --quiet
      - name: build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.server
          load: true
          push: false
          tags: illumia-server:ci
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan test image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: illumia-server:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  # ブランチ保護の必須チェックはこのジョブだけを指定する。
  # skip されたジョブは成功扱い、failure / cancelled があれば落とす。
  ci-ok:
    needs: [changes, rust, web, ml, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "CI failed"; exit 1 ;;
            *) echo "CI ok" ;;
          esac
