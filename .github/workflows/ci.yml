# CI: push / PR で変更のあったコンポーネントのみ lint + test を実行する。
# docs のみの変更でも必ず green になる (集約ジョブ ci-ok を必須チェックにする)。
# 仕様: docs/09_dev_workflow.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml から同一 commit に対して呼び出す (docs/12: SEC-006)。
  workflow_call:
    inputs:
      full:
        description: 'paths-filter を無視して全ジョブを実行する (release 用)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  # event_name を含めないと、release から呼ばれた CI (workflow_call) と
  # main への push で起動した CI が同じ group になり、後から来た push が
  # release 側の CI を巻き込んで cancel してしまう。
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions syntax
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          fail-on-error: true
          pyflakes: false
          shellcheck: false
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          persona: auditor
          min-severity: medium
          min-confidence: high
          online-audits: false
          advanced-security: false
          annotations: true

  changes:
    runs-on: ubuntu-latest
    # release から呼ばれたときは paths-filter を通さず全ジョブを走らせる。
    # タグ push には比較対象が無く、フィルタが全 false になって CI が
    # 素通りするのを防ぐ (docs/12: SEC-006)。
    outputs:
      rust: ${{ inputs.full && 'true' || steps.filter.outputs.rust }}
      web: ${{ inputs.full && 'true' || steps.filter.outputs.web }}
      android: ${{ inputs.full && 'true' || steps.filter.outputs.android }}
      ml: ${{ inputs.full && 'true' || steps.filter.outputs.ml }}
      docker: ${{ inputs.full && 'true' || steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.full }}
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - '.github/workflows/**'
            android:
              - 'apps/android/**'
              - '.github/workflows/**'
            ml:
              - 'ml/**'
              - '.github/workflows/**'
            docker:
              - '.dockerignore'
              - 'docker/**'
              - 'ml/**'
              - 'crates/**'
              - 'web/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # illumia-desktop (eframe/glow) のビルドに必要な X11/Wayland/GL の開発ヘッダ。
      - name: install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install without arbitrary lifecycle scripts
        run: npm ci --ignore-scripts
      - name: dependency audit
        run: npm audit --audit-level=high
      - name: lint / check
        run: |
          npm run lint --if-present
          npm run check --if-present
      - name: test
        run: npm test --if-present
      - name: build
        run: npm run build

  # apps/android/src-tauri は root から独立した Rust workspace なので専用 gate で検査する。
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/android/src-tauri
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - name: install Tauri host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: verify locked Android manifests
        run: cargo metadata --manifest-path apps/android/src-tauri/Cargo.toml --locked --format-version 1 >/dev/null
      - name: fmt
        run: cargo fmt --manifest-path apps/android/src-tauri/Cargo.toml --all --check
      - name: clippy
        run: cargo clippy --manifest-path apps/android/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --manifest-path apps/android/src-tauri/Cargo.toml --locked
      - name: Android-target dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file apps/android/src-tauri/Cargo.lock \
            --target-os android --target-arch aarch64
      - name: npm dependency audit
        working-directory: apps/android
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      # 本番依存を完全 pin + hash 付きで export し、既知脆弱性を監査する。
      # audit tool 自身の version も固定する (docs/12: SEC-008)。
      - name: dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements.txt -o requirements-audit.txt
          uv run --no-project --with pip-audit==2.10.1 -- \
            pip-audit --strict --disable-pip -r requirements-audit.txt
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: |
          if [ -d tests ]; then uv run pytest; else echo "no tests yet"; fi

  # 実 server がビルド済み SPA を配信する経路で主要 route を開き、CSP 違反を検出する。
  # SEC-001 (本番 Web UI が CSP で起動しない) の回帰ゲート → docs/12_security.md
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build server
        run: cargo build --release -p illumia-server
      - name: install web deps
        working-directory: web
        run: npm ci --ignore-scripts
      - name: build web (inline script の外部化を含む)
        working-directory: web
        run: npm run build
      - name: install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: illumia-server
            dockerfile: docker/Dockerfile.server
            trivyignore: .trivyignore.server.yaml
          - image: illumia-ml
            dockerfile: docker/Dockerfile.ml
            trivyignore: .trivyignore.ml.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
      - name: validate production image and compose policy
        env:
          ILLUMIA_SERVER_DIGEST: '1111111111111111111111111111111111111111111111111111111111111111'
          ILLUMIA_ML_DIGEST: '2222222222222222222222222222222222222222222222222222222222222222'
        run: |
          bash -n docker/compose-prod.sh
          ./docker/compose-prod.sh --check-only
          test "$(grep -Ec '^[[:space:]]+build:' docker/compose.dev.yaml)" -eq 2
      - name: validate compose
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml --profile ml config --quiet
      - name: build ${{ matrix.image }} test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:ci
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: verify MiniZip attack surface is absent
        if: matrix.image == 'illumia-server'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE:ci" -ceu '
            ! command -v minizip
            ! command -v miniunzip
          '
      - name: scan ${{ matrix.image }} test image
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          exit-code: '1'
          # 未修正でも既知の HIGH/CRITICAL を黙認しない。例外が必要なら
          # vulnerability ID・根拠・owner・期限を持つ allowlist を別途レビューする。
          ignore-unfixed: false
          trivyignores: ${{ matrix.trivyignore }}
          vuln-type: os,library
          severity: HIGH,CRITICAL

  # ブランチ保護の必須チェックはこのジョブだけを指定する。
  # skip されたジョブは成功扱い、failure / cancelled があれば落とす。
  ci-ok:
    needs: [workflow-security, changes, rust, web, android, ml, e2e, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "CI failed"; exit 1 ;;
            *) echo "CI ok" ;;
          esac
