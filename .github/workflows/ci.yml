# CI: push / PR で変更のあったコンポーネントのみ lint + test を実行する。
# docs のみの変更でも必ず green になる (集約ジョブ ci-ok を必須チェックにする)。
# 仕様: docs/09_dev_workflow.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml から同一 commit に対して呼び出す (docs/12: SEC-006)。
  workflow_call:
    inputs:
      full:
        description: 'paths-filter を無視して全ジョブを実行する (release 用)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # release から呼ばれたときは paths-filter を通さず全ジョブを走らせる。
    # タグ push には比較対象が無く、フィルタが全 false になって CI が
    # 素通りするのを防ぐ (docs/12: SEC-006)。
    outputs:
      rust: ${{ inputs.full && 'true' || steps.filter.outputs.rust }}
      web: ${{ inputs.full && 'true' || steps.filter.outputs.web }}
      ml: ${{ inputs.full && 'true' || steps.filter.outputs.ml }}
      docker: ${{ inputs.full && 'true' || steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        if: ${{ !inputs.full }}
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - '.github/workflows/**'
            ml:
              - 'ml/**'
              - '.github/workflows/**'
            docker:
              - '.dockerignore'
              - 'docker/**'
              - 'ml/**'
              - 'crates/**'
              - 'web/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      # illumia-desktop (eframe/glow) のビルドに必要な X11/Wayland/GL の開発ヘッダ。
      - name: install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install without arbitrary lifecycle scripts
        run: npm ci --ignore-scripts
      - name: dependency audit
        run: npm audit --audit-level=high
      - name: lint / check
        run: |
          npm run lint --if-present
          npm run check --if-present
      - name: test
        run: npm test --if-present
      - name: build
        run: npm run build

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # 本番依存を完全 pin + hash 付きで export し、既知脆弱性を監査する。
      # audit tool 自身の version も固定する (docs/12: SEC-008)。
      - name: dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements.txt -o requirements-audit.txt
          uv run --no-project --with pip-audit==2.9.0 -- \
            pip-audit --strict --disable-pip -r requirements-audit.txt
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: |
          if [ -d tests ]; then uv run pytest; else echo "no tests yet"; fi

  # 実 server がビルド済み SPA を配信する経路で主要 route を開き、CSP 違反を検出する。
  # SEC-001 (本番 Web UI が CSP で起動しない) の回帰ゲート → docs/12_security.md
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: build server
        run: cargo build --release -p illumia-server
      - name: install web deps
        working-directory: web
        run: npm ci --ignore-scripts
      - name: build web (inline script の外部化を含む)
        working-directory: web
        run: npm run build
      - name: install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: illumia-server
            dockerfile: docker/Dockerfile.server
          - image: illumia-ml
            dockerfile: docker/Dockerfile.ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: validate compose
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml --profile ml config --quiet
      - name: build ${{ matrix.image }} test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:ci
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: scan ${{ matrix.image }} test image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  # ブランチ保護の必須チェックはこのジョブだけを指定する。
  # skip されたジョブは成功扱い、failure / cancelled があれば落とす。
  ci-ok:
    needs: [changes, rust, web, ml, e2e, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "CI failed"; exit 1 ;;
            *) echo "CI ok" ;;
          esac
