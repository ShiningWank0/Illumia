version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Tokyo
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Tokyo
    groups:
      ml-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Tokyo

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns:
          - "*"

  # Android は独立 Cargo ワークスペース。ルートの cargo 設定では追従されないため
  # 個別に登録する (Cargo.lock をコミットしている → docs/12 SEC-007)。
  - package-ecosystem: cargo
    directory: /apps/android/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Tokyo
    groups:
      android-rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Tokyo
    groups:
      android-tooling:
        patterns:
          - "*"
