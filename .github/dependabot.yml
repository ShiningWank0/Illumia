version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Tokyo
    groups:
      web-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /ml
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Tokyo
    groups:
      ml-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Tokyo
    # Repository全体のtoolchain固定と同時にだけ更新する。Dockerfile単独の
    # major/minor更新でNode/Python/Rustの互換性を崩さない。
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major"]
      - dependency-name: rust
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Android は独立 Cargo ワークスペース。ルートの cargo 設定では追従されないため
  # 個別に登録する (Cargo.lock をコミットしている → docs/12 SEC-007)。
  - package-ecosystem: cargo
    directory: /apps/android/src-tauri
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Tokyo
    groups:
      android-rust-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/android
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Tokyo
    groups:
      android-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
