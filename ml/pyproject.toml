[project]
name = "illumia-ml"
version = "0.1.0"
description = "Illumia ML sidecar (ステートレス推論ワーカー → docs/07_ml_integration.md)"
readme = "README.md"
# anime_character_recognize (dghs-imgutils) が Python 3.14 未対応のため 3.12 固定
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "msgpack>=1.1",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "pillow>=11",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "ruff>=0.8",
    "pytest>=8",
]

[project.scripts]
illumia-ml = "illumia_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["illumia_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
