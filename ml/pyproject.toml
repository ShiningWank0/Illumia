[project]
name = "illumia-ml"
version = "0.1.0"
description = "Illumia ML sidecar (ステートレス推論ワーカー → docs/07_ml_integration.md)"
readme = "README.md"
# anime_character_recognize (dghs-imgutils) が Python 3.14 未対応のため 3.12 固定
requires-python = ">=3.12,<3.13"
dependencies = []
# M4 で追加予定: fastapi, uvicorn, onnxruntime, anime_character_recognize (git 依存 pin)

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["illumia_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
